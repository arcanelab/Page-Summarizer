<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Summarizer - Analysis Results</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="results.css" />
  </head>
  <body>
    <div class="container">
      <div id="status-section" class="status-section">
        <div id="status-icon" class="status-icon loading"></div>
        <div id="status-text" class="status-text">Extracting page content...</div>
      </div>

      <div id="result-section" class="result-section" style="display: none">
        <div class="result-header">
          <div id="result-provider" class="result-provider"></div>
          <button id="copy-btn" class="copy-btn">Copy</button>
        </div>
        <div id="result-content" class="result-content"></div>
      </div>

      <div id="error-section" class="error-section" style="display: none">
        <div class="error-icon">⚠️</div>
        <div id="error-text" class="error-text"></div>
        <button id="retry-btn" class="retry-btn">Retry</button>
      </div>
    </div>

    <script type="module" src="results.ts"></script>
  </body>
</html>
